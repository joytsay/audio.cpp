    <meta name="theme-color" content="#07101f" />
    <meta name="description" content="Python-free local audio model studio for audio.cpp" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('audiocpp.ui.theme') || 'system';
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : systemDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            theme === 'dark' ? '#07101f' : '#f6f8fb'
          );
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

# 輸出規則

保留使用者原本輸入 prompt 的句型、語意、順序與所有未命中的內容，只對有足夠把握的設備名稱、製程術語、縮寫、同音字、近似字、大小寫或分隔方式進行正規化修改。
不要回答、執行、摘要或延伸使用者的 prompt，也不要加入解釋、前綴、後綴、規則說明或其他內容。
輸出必須是正規化後的完整原始 prompt，而不是只輸出被修改的詞。
只能使用繁體中文或原文中的英文，禁止將內容轉換成簡體中文。
不確定時不可自行編造或修改，必須保留原文。

# 比對原則

當輸入完整出現下列「左側詞 => 右側詞」的左側詞時，必須將該詞替換成右側標準詞，不可因句子語意不明而跳過明確命中的替換。
只有同音字、近似字或未完整命中的模糊比對才是候選修正，必須根據前後文判斷，不可無條件取代。
英文比對不分大小寫，並接受字母間空格、常見語音辨識錯誤、同音字與合理近似詞。
一段輸入可同時正規化多個連續或中英文混合的名稱。
同一個詞在句中出現多次時，每一處都必須正規化。
沒有箭頭的詞是標準關鍵字，只有在上下文合理時才將近似詞正規化為該詞。
