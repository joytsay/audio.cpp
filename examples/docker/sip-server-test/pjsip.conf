; Minimal worker for the EXISTING OpenSIPS server, not a new local registrar.
; Update the Wi-Fi and public IPs here if they change.
[transport-wifi]
type=transport
protocol=udp
bind=192.168.2.117:5060
local_net=192.168.2.0/24
external_media_address=175.180.90.33
; Advertise the real bind address in SIP. OpenSIPS must route using the
; received source IP/port when NAT changes port 5060 (observed public port 1025).
; Do not force the public signaling IP while leaving its port at 5060.

[auth521]
type=auth
auth_type=userpass
username=521
password=123456

[register521]
type=registration
transport=transport-wifi
outbound_auth=auth521
server_uri=sip:175.180.90.33:9900
client_uri=sip:521@175.180.90.33
contact_user=521
retry_interval=10
expiration=300
; Keep a stable Contact across restarts; gateway-identify handles inbound calls.
line=no

[gateway]
type=endpoint
transport=transport-wifi
context=server-test
outbound_auth=auth521
disallow=all
allow=ulaw
direct_media=no
media_address=192.168.2.117
bind_rtp_to_media_address=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[gateway-identify]
type=identify
endpoint=gateway
match=175.180.90.33
