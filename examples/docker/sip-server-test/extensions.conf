[general]
static=yes
writeprotect=yes

[server-test]
; OpenSIPS may target the registered contact user or a default extension.
exten => 521,1,Goto(server-test-menu,s,1)
exten => s,1,Goto(server-test-menu,s,1)

[server-test-menu]
exten => s,1,Answer()
 same => n,Wait(0.3)
 same => n(menu),NoOp(SERVER TEST menu: 1=echo 2=tone 9=hangup)
 same => n,PlayTones(440/300,0/150,660/300,0/250)
 same => n,Wait(1)
 same => n,StopPlayTones()
 same => n,Read(CHOICE,,1,,1,15)
 same => n,NoOp(SERVER TEST DTMF choice=${CHOICE} status=${READSTATUS})
 same => n,GotoIf($["${READSTATUS}" = "HANGUP"]?done)
 same => n,GotoIf($["${CHOICE}" = "1"]?echo)
 same => n,GotoIf($["${CHOICE}" = "2"]?tone)
 same => n,GotoIf($["${CHOICE}" = "9"]?done)
 same => n,Goto(menu)
 same => n(echo),NoOp(SERVER TEST selected echo: speak and press pound to return)
 same => n,Echo()
 same => n,Goto(menu)
 same => n(tone),NoOp(SERVER TEST selected tone)
 same => n,PlayTones(880)
 same => n,Wait(2)
 same => n,StopPlayTones()
 same => n,Goto(menu)
 same => n(done),Hangup()

