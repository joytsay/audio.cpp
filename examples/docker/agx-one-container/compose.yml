services:
  voice-ai:
    image: audio.cpp-agx-all-in-one:local
    container_name: audiocpp
    build:
      context: ../../..
      dockerfile: .devops/cuda.Dockerfile
      target: all-in-one
      args:
        CUDA_VERSION: ${CUDA_VERSION:?Set CUDA_VERSION to the CUDA release provided by JetPack}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        BASE_CUDA_DEV_CONTAINER: ${BASE_CUDA_DEV_CONTAINER:-docker.io/nvidia/cuda:12.6.3-devel-ubuntu22.04}
        BASE_CUDA_RUN_CONTAINER: ${BASE_CUDA_RUN_CONTAINER:-nvcr.io/nvidia/l4t-cuda:12.6.11-runtime}
        GCC_VERSION: ${GCC_VERSION:-11}
        CUDA_DOCKER_ARCH: ${CUDA_ARCH:-87-real}
        AUDIOCPP_MODEL_SET: full
        AUDIOCPP_CPU_ALL_VARIANTS: "OFF"
        BUILD_JOBS: ${BUILD_JOBS:-2}
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-5202104b59ada9005db079eea43882a2b7bf5802}
        RAGCPP_REF: ${RAGCPP_REF:-748bbd4895e0939857ffcc10276da1c91f20b439}
    runtime: nvidia
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      LLAMA_CACHE: /app/llama-models/cache
      AUDIOCPP_MAX_LOADED_MODELS: 1
      AUDIOCPP_IDLE_UNLOAD_MS: 60000
      AUDIOCPP_BOOTSTRAP_PACKAGES: qwen3_asr_0_6b_q8_0,zipvoice_distill_gguf
      LLAMA_BOOTSTRAP_MODEL: bartowski/Qwen2.5-3B-Instruct-GGUF:Q4_K_M
      LLAMA_MODELS_MAX: 1
      LLAMA_CTX_SIZE: 4096
      LLAMA_GPU_LAYERS: 99
      RAG_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
      RAG_EMBEDDING_CTX_SIZE: 4096
      RAG_EMBEDDING_GPU_LAYERS: 99
    volumes:
      # Keep downloaded models, RAG index, knowledge, and prompt edits on the host.
      - ../../../audio-models:/app/models
      - ../../../llama-models:/app/llama-models
      - ../../../rag-data:/app/rag-data
      - ../../../knowledge:/app/knowledge
      - ../../../voices:/app/voices
      - ../../../prompt.csv:/app/prompt.csv
      - ../../../hotword.csv:/app/hotword.csv
      # Runtime-only routing changes must not require recompiling the native binaries.
      - ../../../.devops/all-in-one-entrypoint.sh:/app/all-in-one-entrypoint.sh:ro
      - ../../../.devops/generate-prompt-knowledge.sh:/app/generate-prompt-knowledge.sh:ro
      - ../../../.devops/all-in-one-server.json:/app/all-in-one-server.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8081/health >/dev/null && curl -fsS http://127.0.0.1:8082/health >/dev/null && curl -fsS http://127.0.0.1:8084/health >/dev/null
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  https:
    image: caddy:2.11.4-alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - voice-ai
    ports:
      - "${AUDIOCPP_HTTPS_PORT:-8083}:443"
    environment:
      AUDIOCPP_HTTPS_HOST: ${AUDIOCPP_HTTPS_HOST:-192.168.5.151}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - audiocpp-https-data:/data
      - audiocpp-https-config:/config
    restart: unless-stopped

  # Setup uses the CPU-only SIP image. No host C++ installation is necessary.
  sip-setup:
    profiles: [setup]
    image: audio.cpp-sip:local
    build:
      context: ../../..
      dockerfile: .devops/cuda.Dockerfile
      target: sip-runtime
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        BUILD_JOBS: ${BUILD_JOBS:-2}
    network_mode: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: ["/opt/sip/bin/coturn_setup"]
    command: ["--env", "/settings/.env", "--template", "/settings/.env.example"]
    volumes:
      - ./:/settings

  sip:
    profiles: [sip]
    image: audio.cpp-sip:local
    build:
      context: ../../..
      dockerfile: .devops/cuda.Dockerfile
      target: sip-runtime
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        BUILD_JOBS: ${BUILD_JOBS:-2}
    network_mode: host
    depends_on:
      voice-ai:
        condition: service_healthy
      coturn:
        condition: service_started
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      SIP_ACCOUNT: ${SIP_ACCOUNT:-}
      SIP_PROXY: ${SIP_PROXY:-}
      SIP_SECRET: ${SIP_SECRET:-}
      SIP_AUTHUSER: ${SIP_AUTHUSER:-}
      SIP_TARGET: ${SIP_TARGET:-listen}
      SIP_GREETING: ${SIP_GREETING-歡迎來電期偶科技 請問我可以怎麼服務您}
      SIP_WAIT_FOR_MEDIA: ${SIP_WAIT_FOR_MEDIA:-1}
      SIP_CODEC: ${SIP_CODEC:-PCMU}
      SIP_DTMF_MODE: ${SIP_DTMF_MODE:-rtp}
      SIP_INTERFACE: ${SIP_INTERFACE:-}
      SIP_LISTEN: ${SIP_LISTEN:-}
      SIP_RTP_PORTS: ${SIP_RTP_PORTS:-10000-20000}
      COTURN_URL: ${COTURN_URL:-}
      COTURN_USERNAME: ${COTURN_USERNAME:-ivrtts}
      COTURN_PASSWORD: ${COTURN_PASSWORD:-}
      AUDIOCPP_URL: http://127.0.0.1:8081
      LLM_URL: http://127.0.0.1:8082/v1
      LLM_MODEL: ${SIP_LLM_MODEL:-bartowski/Qwen2.5-3B-Instruct-GGUF:Q4_K_M}
      LLM_API_KEY: ${LLM_API_KEY:-}
      RAG_URL: http://127.0.0.1:8081/v1/rag
      VAD_MODEL: ${SIP_VAD_MODEL:-silero-vad}
      STT_MODEL: ${SIP_STT_MODEL:-qwen3-asr}
      STT_LANGUAGE: ${SIP_STT_LANGUAGE:-}
      STT_HOTWORDS_FILE: /app/hotword.csv
      TTS_MODEL: ${SIP_TTS_MODEL:-zipvoice}
      TTS_VOICE: ${SIP_TTS_VOICE:-lingCL}
      IVRTTS_VOICE_DIR: /opt/sip/share/voices
    volumes:
      - ../../../hotword.csv:/app/hotword.csv:ro
      - ../../../.devops/sip-entrypoint.sh:/app/sip-entrypoint.sh:ro

  coturn:
    profiles: [sip]
    image: ${COTURN_IMAGE:-coturn/coturn:4.18.0-r0-alpine}
    # Linux host networking keeps relay addresses and UDP ports unchanged.
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    entrypoint: ["/bin/sh", "/usr/local/bin/start-coturn.sh"]
    environment:
      COTURN_LISTEN_IP: ${COTURN_LISTEN_IP:-}
      COTURN_RELAY_IP: ${COTURN_RELAY_IP:-${COTURN_LISTEN_IP:-}}
      COTURN_EXTERNAL_IP: ${COTURN_EXTERNAL_IP:-}
      COTURN_PORT: ${COTURN_PORT:-3478}
      COTURN_REALM: ${COTURN_REALM:-ivrtts}
      COTURN_USERNAME: ${COTURN_USERNAME:-ivrtts}
      COTURN_PASSWORD: ${COTURN_PASSWORD:-}
      COTURN_MIN_PORT: ${COTURN_MIN_PORT:-49160}
      COTURN_MAX_PORT: ${COTURN_MAX_PORT:-49200}
    volumes:
      - ../cotrun/start-coturn.sh:/usr/local/bin/start-coturn.sh:ro
    tmpfs:
      - /tmp:mode=1777
      - /var/lib/coturn:mode=1777

volumes:
  audiocpp-https-data:
  audiocpp-https-config:
