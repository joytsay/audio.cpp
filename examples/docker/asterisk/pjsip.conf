; Local test credentials. Change both passwords before use on a shared LAN.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:9900

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[local-endpoint](!)
type=endpoint
transport=transport-udp
context=local-test
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[521](local-endpoint)
auth=auth521
aors=521

[auth521]
type=auth
auth_type=userpass
username=521
password=123456

[521]
type=aor
max_contacts=1
remove_existing=yes

; Separate browser registration: never replace the pipeline's 521 contact.
[520]
type=endpoint
transport=transport-ws
context=local-test
disallow=all
allow=ulaw
auth=auth520
aors=520
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[auth520]
type=auth
auth_type=userpass
username=520
password=123456

[520]
type=aor
max_contacts=1
remove_existing=yes

[1002](local-endpoint)
auth=auth1002
aors=1002

[auth1002]
type=auth
auth_type=userpass
username=1002
password=phone-test-1002

[1002]
type=aor
max_contacts=1
remove_existing=yes
