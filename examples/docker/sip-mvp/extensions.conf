[general]
static=yes
writeprotect=yes

[sip-mvp]
; Immediate, generated audio: no sound files, TTS or AI server required.
exten => 600,1,Answer()
 same => n,NoOp(MVP echo test started)
 same => n,Echo()
 same => n,Hangup()

exten => 521,1,Answer()
 same => n,Wait(0.3)
 same => n(menu),NoOp(MVP menu: 1=echo 2=tone 9=hangup)
 same => n,PlayTones(440/300,0/150,660/300,0/250)
 same => n,Wait(1)
 same => n,StopPlayTones()
 same => n,Read(CHOICE,,1,,1,15)
 same => n,NoOp(MVP DTMF choice=${CHOICE} status=${READSTATUS})
 same => n,GotoIf($["${READSTATUS}" = "HANGUP"]?done)
 same => n,GotoIf($["${CHOICE}" = "1"]?echo)
 same => n,GotoIf($["${CHOICE}" = "2"]?tone)
 same => n,GotoIf($["${CHOICE}" = "9"]?done)
 same => n,Goto(menu)
 same => n(echo),NoOp(MVP selected echo: speak and press pound to return)
 same => n,Echo()
 same => n,Goto(menu)
 same => n(tone),NoOp(MVP selected tone)
 same => n,PlayTones(880)
 same => n,Wait(2)
 same => n,StopPlayTones()
 same => n,Goto(menu)
 same => n(done),Hangup()

; Optional: route to the existing native IVR worker after local RTP/DTMF works.
exten => 522,1,Dial(PJSIP/522,30)
 same => n,Hangup()
