; Local Wi-Fi test. If the Jetson Wi-Fi address changes, update all three
; occurrences of 192.168.2.117 below before starting this service.
[transport-wifi]
type=transport
protocol=udp
bind=192.168.2.117:9910

[phone](!)
type=endpoint
transport=transport-wifi
context=sip-mvp
disallow=all
allow=ulaw
direct_media=no
media_address=192.168.2.117
bind_rtp_to_media_address=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

; Softphone account. Dial 600 for echo or 521 for the keypad menu.
[520](phone)
auth=auth520
aors=520

[auth520]
type=auth
auth_type=userpass
username=520
password=123456

[520]
type=aor
max_contacts=1
remove_existing=yes

; Optional native AI worker account, used only after the baseline tests pass.
[522](phone)
auth=auth522
aors=522

[auth522]
type=auth
auth_type=userpass
username=522
password=123456

[522]
type=aor
max_contacts=1
remove_existing=yes
